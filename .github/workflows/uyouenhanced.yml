name: Build uYouEnhanced for both iPads
on:
  workflow_dispatch:
  push:
    paths:
      - 'ports/uyouenhanced/**'
      - '.github/workflows/uyouenhanced.yml'
  pull_request:
    paths:
      - 'ports/uyouenhanced/**'
      - '.github/workflows/uyouenhanced.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Test download selection and sponsor skipping
        run: make -C ports/uyouenhanced test
      - name: Build and verify rootful iOS 12 and rootless iPadOS packages
        run: make -C ports/uyouenhanced package
      - uses: actions/upload-artifact@v4
        with:
          name: uyouenhanced-ipad-packages
          path: ports/uyouenhanced/dist/*
