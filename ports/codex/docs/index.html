<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Codex for iPadOS</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #f8fafc; }
      main { width: min(36rem, calc(100% - 3rem)); padding: 3rem 0; }
      h1 { margin: 0 0 .75rem; font-size: clamp(2.2rem, 9vw, 4.5rem); letter-spacing: -.06em; }
      p { color: #aebbd0; font-size: 1.05rem; line-height: 1.6; }
      a.button { display: inline-block; margin-top: 1rem; padding: .9rem 1.2rem; border-radius: .8rem; background: #f8fafc; color: #0b1020; text-decoration: none; font-weight: 700; }
      code { color: #d8e3f5; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1>Codex for iPadOS</h1>
      <p>Experimental arm64 port of the open-source OpenAI Codex CLI for rootless jailbroken iPads.</p>
      <a class="button" href="sileo://source/https://nikovonlas.github.io/ios-ports/">Add to Sileo</a>
      <p>Source: <code>https://nikovonlas.github.io/ios-ports/</code></p>
    </main>
  </body>
</html>
